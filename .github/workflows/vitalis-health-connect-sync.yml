name: Vitalis Health Connect Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      GOOGLE_DRIVE_ZIP_URL: ${{ secrets.GOOGLE_DRIVE_ZIP_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Download repo source
        run: |
          curl -L \
            -H "Authorization: Bearer ${{ github.token }}" \
            -o repo.zip \
            "https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip"
          unzip repo.zip
          mv Vitalis-* repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Vitalis Health Connect sync
        working-directory: repo
        run: python cloud/run_health_connect_sync.py